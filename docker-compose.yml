services:
  postgres:
    image: postgres:16
    container_name: movie-log-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create_tables.sql:/docker-entrypoint-initdb.d/01_create_table.sql:Z
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:Z
